{{- /* 交互脚本：导航指示器、滚动动画、阅读进度 */ -}}
<div id="reading-progress" aria-hidden="true"></div>

<script>
(function () {
    'use strict';

    /* ---- 导航滑动指示器 ---- */
    const menu = document.getElementById('menu');
    if (menu && !document.body.classList.contains('home')) {
        const indicator = document.createElement('span');
        indicator.className = 'nav-indicator';
        menu.appendChild(indicator);

        function moveIndicator(link) {
            if (!link) {
                indicator.style.opacity = '0';
                return;
            }
            const menuRect = menu.getBoundingClientRect();
            const rect = link.getBoundingClientRect();
            indicator.style.width = rect.width + 'px';
            indicator.style.left = (rect.left - menuRect.left + menu.scrollLeft) + 'px';
            indicator.style.opacity = '1';
        }

        const links = menu.querySelectorAll('a');
        const activeLink = menu.querySelector('a .active')?.closest('a');
        if (activeLink) moveIndicator(activeLink);

        links.forEach(function (link) {
            link.addEventListener('mouseenter', function () { moveIndicator(link); });
            link.addEventListener('focus', function () { moveIndicator(link); });
        });

        menu.addEventListener('mouseleave', function () { moveIndicator(activeLink); });
        window.addEventListener('resize', function () { moveIndicator(activeLink); });
    }

    /* ---- 滚动渐入动画 ---- */
    const revealEls = document.querySelectorAll(
        '.reveal, .post-entry, .post-content, .page-content, .about-page h3, .about-page table, .about-page hr, .contact-cards, .about-quote, .post-single .post-header, .taxonomy-cloud, .topics-section, .topic-card, .topic-path-card, .topic-group-card, .topic-term-item'
    );

    if (revealEls.length && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        revealEls.forEach(function (el) { el.classList.add('reveal-init'); });

        const observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('reveal-visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });

        revealEls.forEach(function (el) { observer.observe(el); });
    } else {
        revealEls.forEach(function (el) { el.classList.add('reveal-visible'); });
    }

    /* ---- 阅读进度条（文章页） ---- */
    const progressBar = document.getElementById('reading-progress');
    const article = document.querySelector('.post-content, .page-content');

    if (progressBar && article) {
        progressBar.classList.add('active');

        function updateProgress() {
            const rect = article.getBoundingClientRect();
            const total = article.scrollHeight;
            const scrolled = window.scrollY - article.offsetTop + window.innerHeight * 0.3;
            const pct = Math.min(100, Math.max(0, (scrolled / total) * 100));
            progressBar.style.width = pct + '%';
        }

        window.addEventListener('scroll', updateProgress, { passive: true });
        updateProgress();
    }

    /* ---- 按钮点击涟漪 ---- */
    document.querySelectorAll('.profile .button, .contact-card').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            const rect = btn.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            btn.style.position = 'relative';
            btn.style.overflow = 'hidden';
            btn.appendChild(ripple);
            ripple.addEventListener('animationend', function () { ripple.remove(); });
        });
    });

    /* ---- 关于页头像 hover 微动效 ---- */
    document.querySelectorAll('.about-avatar-wrap').forEach(function (wrap) {
        wrap.addEventListener('mousemove', function (e) {
            const rect = wrap.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;
            wrap.style.transform = 'rotateY(' + (x * 12) + 'deg) rotateX(' + (-y * 12) + 'deg)';
        });
        wrap.addEventListener('mouseleave', function () {
            wrap.style.transform = '';
        });
    });

    /* ---- 头像点击：播放 / 暂停音乐 + 首页特效 ---- */
    (function () {
        const avatar = document.querySelector('.avatar-wrap.avatar-interactive');
        const audio = document.getElementById('avatar-audio');
        if (!avatar || !audio) return;

        const musicUrl = avatar.dataset.music || audio.currentSrc || audio.getAttribute('src');
        if (!musicUrl) return;

        if (!audio.getAttribute('src')) {
            audio.src = musicUrl;
        }

        function setPlaying(playing) {
            avatar.classList.toggle('is-playing', playing);
            document.body.classList.toggle('music-playing', playing);
            avatar.setAttribute('aria-label', playing ? '点击暂停音乐' : '点击播放音乐');
            avatar.setAttribute('aria-pressed', playing ? 'true' : 'false');
        }

        function toggleMusic() {
            if (audio.paused) {
                audio.play().then(function () {
                    setPlaying(true);
                }).catch(function (err) {
                    console.error('音乐播放失败:', err);
                    setPlaying(false);
                });
            } else {
                audio.pause();
                setPlaying(false);
            }
        }

        avatar.addEventListener('click', toggleMusic);

        audio.addEventListener('ended', function () {
            setPlaying(false);
        });

        audio.addEventListener('error', function () {
            console.error('音频加载失败，请检查文件路径:', musicUrl);
            setPlaying(false);
        });
    })();

    /* ---- 代码复制反馈增强 ---- */
    document.addEventListener('click', function (e) {
        if (e.target.classList.contains('copy-code')) {
            e.target.style.background = 'rgba(52, 211, 153, 0.8)';
            setTimeout(function () {
                e.target.style.background = '';
            }, 1500);
        }
    });

    /* ---- 文章列表错落动画 ---- */
    document.querySelectorAll('.post-entry').forEach(function (el, i) {
        el.style.setProperty('--i', i);
    });

    /* ---- 主题页搜索过滤 ---- */
    const topicSearch = document.getElementById('topic-search');
    const topicsGrid = document.getElementById('topics-grid');
    const topicsEmpty = document.getElementById('topics-empty');

    if (topicSearch && topicsGrid) {
        topicSearch.addEventListener('input', function () {
            const q = topicSearch.value.trim().toLowerCase();
            let visible = 0;

            topicsGrid.querySelectorAll('.topic-card').forEach(function (card) {
                const name = card.getAttribute('data-topic') || '';
                const text = card.textContent.toLowerCase();
                const match = !q || name.includes(q) || text.includes(q);
                card.hidden = !match;
                if (match) visible++;
            });

            if (topicsEmpty) {
                topicsEmpty.hidden = visible > 0;
            }
        });
    }
})();
</script>
